function loadQ(){const c=S.mode=='ai'?(S.ch<0?ri(0,4):S.ch):S.ch;
S.q=S.mode=='ai'?build(c,ri(0,4),1,(Math.random()*1e9)|0):bankQ(c,S.i);S.ans=null;
$('qh').textContent=(S.mode=='ai'?'🤖 AI · ':'')+'BAB '+(S.q.ch+1)+': '+CH[S.q.ch].t;
$('qp').textContent=S.mode=='ai'?'SOAL AI BARU':'PANEL '+(S.i+1)+' / '+N;
$('qtext').innerHTML=S.q.q;
$('opts').innerHTML=S.q.o.map((o,k)=>`<button class="btn opt flex gap-2" data-k="${k}" onclick="pickA(${k})"><span class="sfx text-xl w-6">${'ABCDE'[k]}.</span><span>${o}</span></button>`).join('');
$('fb').innerHTML='';$('prev').classList.toggle('hidden',S.mode=='ai');$('next').textContent=S.mode=='ai'?'🤖 Soal Baru ▶':'Berikutnya ▶';
const dn=st.done[S.q.ch+'-'+S.i];if(S.mode=='bank'&&dn)$('qp').textContent+=' ✔';math($('sc-quiz'));scrollTo(0,0)}
/* ---------- FORMAT PENYELESAIAN KE BAWAH ---------- */
function splitEq(t){const p=[];let d=0,c='';for(const ch of t){if(ch=='{')d++;else if(ch=='}')d--;if(ch=='='&&d==0){p.push(c);c=''}else c+=ch}p.push(c);return p}
function fmtStep(str){const [L,E]=str.split('||');
const rows=L.split(';;').map(l=>{l=l.trim();const p=splitEq(l);if(p.length<2)return l;const lf=p.shift().trim();return (lf?lf+' &= ':'&= ')+p.join('=')});
return `<div class="solv">$$\\begin{aligned}${rows.join(' \\\\ ')}\\end{aligned}$$</div>`+(E?`<div class="expl">💬 <b>Penjelasan:</b> ${E.trim()}</div>`:'')}
function solution(q){const chains=[];let cur=null;
q.s.forEach((st,i)=>{const [L]=st.split('||');L.split(';;').forEach((l,j,arr)=>{l=l.trim();const p=splitEq(l);const last=j==arr.length-1;
if(p.length<2){chains.push({left:l,rows:[],raw:1});cur=null;return}
const lf=p.shift().trim(),r=p.join('=').trim(),tag=last?i+1:0;
if(cur&&(lf===''||lf===cur.left))cur.rows.push({r,n:tag});else{cur={left:lf,rows:[{r,n:tag}]};chains.push(cur)}})});
const defs={};q.d.forEach(x=>{const m=x.match(/^\$([a-z])\(x\)=(.+)\$$/);if(m)defs[m[1]]=m[2]});
const out=chains.map((c,ci)=>{if(c.raw)return c.left;let rows=c.rows.slice(),left=c.left;const m=left.match(/^([a-z])\(-?\d+\)$/);
if(m&&defs[m[1]]){rows.unshift({r:defs[m[1]],n:0});left=m[1]+'(x)'}
return rows.map((w,k)=>{let r=w.r;if(ci==chains.length-1&&k==rows.length-1)r='\\underline{\\underline{'+r+'}}';return (k==0?left+' &= ':'&= ')+r}).join(' \\\\ ')}).map(b=>'\\begin{aligned}'+b+'\\end{aligned}');
const ex=q.s.map((st,i)=>{const E=(st.split('||')[1]||'').trim();return E?`<div class="expl">▸ ${E}</div>`:''}).join('');
return `<div class="solv">$$${out.join('$$$$')}$$</div><div class="mt-2"><b>💬 Penjelasan:</b></div>${ex}`}
function pickA(k){if(S.ans!==null)return;S.ans=k;const q=S.q,ok=k==q.a,key=q.ch+'-'+S.i;
document.querySelectorAll('.opt').forEach((b,i)=>{if(i==q.a)b.classList.add('ok');else if(i==k)b.classList.add('bad')});
let gain=0;if(ok&&(S.mode=='ai'||!st.done[key])){gain=100;st.xp+=100;st.stars+=1;if(S.mode=='bank')st.done[key]=1;save()}
const hd=ok?`<div class="sfx text-5xl pop text-green-700">BAM! BENAR! ${gain?'(+100 XP)':'(sudah diklaim)'}</div><div class="bub mt-2">SUKSES! Tetap baca panel pembahasan agar paham alurnya ya!</div>`
:`<div class="sfx text-5xl pop text-red-600">BELUM TEPAT!</div><div class="bub mt-2">Belum Tepat! Mari kita bedah panel penyelesaiannya: jawaban benar adalah <b>${'ABCDE'[q.a]}</b>.</div>`;
const ask=q.q.split(/(?<=[.?])\s+(?=[A-Z])/).pop().replace(/\.{3,}/g,'…');
const why=ok?'':`<div class="sec" style="border-color:#e11d2e"><h3 style="background:#e11d2e">🔎 KENAPA JAWABANMU KELIRU?</h3><div>Kamu memilih <b>${'ABCDE'[k]}</b> (${q.o[k]}). Nilainya berbeda dengan hasil perhitungan. Penyebab paling umum: salah urutan operasi, salah tanda (+/−), atau tertukar rumus. Cocokkan pekerjaanmu dengan Langkah 1–${q.s.length} di bawah, lalu coba soal berikutnya!</div></div>`;
$('fb').innerHTML=hd+why+`<div class="panel p-3 mt-3"><div class="sfx text-3xl">📖 PEMBAHASAN LENGKAP</div>
<div class="sec"><h3>🎯 1. DIK &amp; DIT</h3><div><b>Dit :</b> ${ask}<br><b>Dik :</b><ul class="list-disc ml-5">${q.d.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>
<div class="sec"><h3>📘 2. KONSEP &amp; RUMUS UTAMA</h3><div>${q.k}<div class="mt-1 bg-yellow-100 border-2 border-black px-2">$$${q.f}$$</div></div></div>
<div class="sec"><h3>🛠️ 3. PENYELESAIAN</h3><div>${solution(q)}</div></div>
<div class="ans"><b>✅ JAWABAN: ${'ABCDE'[q.a]}.</b> ${q.o[q.a]}</div>
<div class="sec"><h3>💬 PENJELASAN KESIMPULAN</h3><div>Dari langkah-langkah di atas, hasil akhirnya adalah ${q.o[q.a]}. Jadi jawaban yang benar adalah pilihan <b>${'ABCDE'[q.a]}</b>.<br><b>Intinya:</b> ${q.k}</div></div>
<div class="sec"><h3>🔁 4. CEK ULANG</h3><div>Masukkan jawaban <b>${'ABCDE'[q.a]}</b> kembali ke soal. Hasilnya harus cocok dengan data yang diketahui. Jika belum cocok, periksa lagi tanda dan urutan operasi.</div></div>
<div class="bub mt-3">💡 <b>Tips Manga / Jebakan:</b> ${q.t}</div></div>`;math($('fb'));setTimeout(()=>$('fb').scrollIntoView({behavior:'smooth'}),150)}
function nav(d){if(S.mode=='ai')return loadQ();const i=S.i+d;if(i<0||i>=N){if(i>=N){toast('🎉 Bab selesai! GANBARU!');return goLobby()}return}S.i=i;loadQ()}
/* ---------- LAB ---------- */
function showLab(){show('sc-lab');calc()}
function calc(){const r=+$('lr').value||0,t=Math.min(360,+$('lt').value||0),p=eval($('lp').value),ps=$('lp').value=='22/7'?'\\frac{22}{7}':'3{,}14';
const arc=t/360*2*p*r,K=2*p*r,L=p*r*r,e=t*Math.PI/180,x=100+80*Math.cos(e),y=100-80*Math.sin(e);
$('svg').innerHTML=`<circle cx="100" cy="100" r="80" fill="#fff" stroke="#111" stroke-width="3"/><path d="M100 100 L180 100 A80 80 0 ${t>180?1:0} 0 ${x.toFixed(1)} ${y.toFixed(1)} Z" fill="#111" opacity=".85"/><text x="100" y="196" text-anchor="middle" font-size="12" font-weight="900">θ = ${t}°</text>`;
$('lout').innerHTML=[`Keliling: $K=2\\pi r=2\\times${ps}\\times${r}=${m(K)}$`,`Luas: $L=\\pi r^2=${m(L)}$`,`Panjang busur: $\\frac{${t}}{360}\\times2\\times${ps}\\times${r}=\\mathbf{${m(arc)}}$`,`Luas juring: $\\frac{${t}}{360}\\times\\pi r^2=${m(t/360*L)}$`].map(x=>`<div class="step">${x}</div>`).join('');math($('lout'))}
['lr','lt','lp'].forEach(i=>$(i).addEventListener('input',calc));
/* ---------- PWA ---------- */
let dp=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
async function installApp(){if(dp){dp.prompt();await dp.userChoice;dp=null}else toast('Chrome: menu ⋮ → "Instal aplikasi" / "Tambahkan ke layar utama". Pastikan dibuka lewat https (GitHub Pages).')}
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),4000)}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
